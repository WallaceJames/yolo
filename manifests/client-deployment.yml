apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas:3
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: your-client-image  # Replace with your actual client Docker image
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_BACKEND_URL
          value: "http://backend:5000"  # Replace with your backend URL
---
apiVersion: v1
kind: Service
metadata:
  name: client
spec:
  ports:
  - port: 3001
    targetPort: 3000
  selector:
    app: client
